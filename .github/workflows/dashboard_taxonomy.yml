name: dashboard_taxonomy

on:
  schedule:
    - cron: "10 * * * *" # hourly, 10 min after metal_prices.yml's :00 run so it picks up fresh prices
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard_taxonomy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA rather than the mutable @v4/@v5 tag, matching briefing.yml --
      # this workflow runs unattended on a schedule with `contents: write`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build dashboard/taxonomy.json
        run: python scripts/build_dashboard_taxonomy.py

      - name: Commit and push
        run: |
          git config user.name "gi-dashboard-taxonomy"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard/taxonomy.json
          git diff --cached --quiet || git commit -m "dashboard taxonomy: $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main
          git push
