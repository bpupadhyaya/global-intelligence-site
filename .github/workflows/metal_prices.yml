name: metal_prices

on:
  schedule:
    - cron: "0 * * * *" # hourly -- spot metal prices move faster than the briefing's 4h cadence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metal_prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA rather than the mutable @v4/@v5 tag, matching briefing.yml --
      # this workflow runs unattended on a schedule with `contents: write`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build gold/silver/copper price.json files
        run: python scripts/build_metal_price.py

      - name: Commit and push
        run: |
          git config user.name "gi-metal-prices"
          git config user.email "actions@users.noreply.github.com"
          git add data/commodities/gold_price.json data/commodities/silver_price.json data/commodities/copper_price.json
          git diff --cached --quiet || git commit -m "metal prices: $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main
          git push
