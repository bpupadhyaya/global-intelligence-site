name: validate

on:
  pull_request:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  import-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA rather than the mutable @v4/@v5 tag, matching the convention
      # already established in briefing.yml for this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Both scripts have an `if __name__ == "__main__":` guard, so importing them exercises
      # every top-level import and function/class definition (catching e.g. a dependency bump
      # that renamed something a script relies on) without making any real network calls or
      # writing data/briefing.json / data/commodities/*_price.json — no live fetch needed just
      # to validate the code still loads.
      - name: Import-check the pipeline scripts
        working-directory: scripts
        run: |
          python -c "import build_briefing"
          python -c "import build_metal_price"
          python -c "import build_dashboard_taxonomy"
