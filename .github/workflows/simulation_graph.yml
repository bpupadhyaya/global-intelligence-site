name: simulation_graph

# Rebuilds data/simulation/graph.json from data/simulation_src/*.json + the site's own
# supply_chain_paths.json / supply_chain_geo.json / dashboard/taxonomy_structure.json.
# Lives entirely in this repo (source data, script, and output) specifically so it needs no
# cross-repo credential -- see scripts/build_simulation_graph.py's header for why this moved
# here from the private repo. Only re-runs anything meaningful when those inputs change; cheap
# to run on a schedule regardless since it's pure local computation, no external fetches.

on:
  schedule:
    - cron: "40 */4 * * *" # every 4 hours, offset from the other pipelines' cadences
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simulation_graph
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the simulation graph
        run: python3 scripts/build_simulation_graph.py

      - name: Commit and push
        run: |
          git config user.name "gi-simulation-graph"
          git config user.email "actions@users.noreply.github.com"
          git add data/simulation/graph.json
          git diff --cached --quiet || git commit -m "simulation graph: $(date -u +%FT%H:%MZ)"
          git pull --rebase origin main
          git push
