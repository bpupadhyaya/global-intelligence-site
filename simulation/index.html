<body class="sim-page">

<a class="skip-link" href="#sim-canvas-wrap">Skip to diagram</a>

<header class="sim-page-header">
    <a href="../" class="sim-page-crumb-home"><span class="globe" aria-hidden="true">🌐</span> Global Intelligence</a>
    <span class="sim-page-crumb-sep" aria-hidden="true">/</span>
    <span class="sim-page-crumb-current">Simulation</span>
    <span class="sim-page-hint">Click any node or line to disable it and see the effect ripple outward</span>
    <span class="sim-page-stamp" id="sim-stamp">Loading the graph…</span>
</header>

<main class="sim-fullpage-wrap" id="sim-canvas-wrap">
    <div class="sim-canvas-wrap">
        <canvas id="sim-canvas" aria-label="Interactive global graph — supply chain, human endeavor items, and financial layer"></canvas>
        <div class="sim-tooltip" id="sim-tooltip" hidden></div>
    </div>

    <button class="sim-panel-toggle" id="sim-panel-toggle" aria-expanded="true" aria-controls="sim-panel">Search &amp; detail ▾</button>

    <aside class="sim-overlay-panel" id="sim-panel">
        <input type="search" id="sim-search" class="search-input"
            placeholder="Search a node or route…" aria-label="Search a node or route">
        <div class="sim-overlay-section">
            <div class="sim-overlay-head" id="sim-list-head">All nodes</div>
            <div class="map-path-list sim-overlay-list" id="sim-node-list"></div>
        </div>
        <div id="sim-detail"></div>
        <div class="sim-overlay-section" id="sim-affected-wrap" hidden>
            <div class="sim-overlay-head">Downstream items</div>
            <div class="sim-overlay-list" id="sim-affected-items"></div>
        </div>
        <div class="sim-legend" id="sim-legend">
            <span><span class="dot" style="background:#168158"></span>Supply chain</span>
            <span><span class="dot" style="background:#1d4ed8"></span>Category hub</span>
            <span><span class="dot" style="background:#7c8a83"></span>Item</span>
            <span><span class="dot" style="background:#b45309"></span>Financial</span>
            <span><span class="dot" style="background:var(--red-500)"></span>Disabled</span>
            <span><span class="dot" style="background:var(--amber-700)"></span>Affected</span>
        </div>
    </aside>

    <noscript><p style="padding:24px;">This page needs JavaScript — or read the raw data at
    <a href="../data/simulation/graph.json">graph.json</a>.</p></noscript>
</main>

<footer class="sim-page-footer">
    <a href="../">← Home</a>
    <a href="../supply-chain/">Supply Chain</a>
    <a href="../items/">Items</a>
    <a href="../sources/">Sources</a>
    <a href="../privacy/">Privacy</a>
</footer>

<script src="../assets/vendor/d3.v7.min.js?v=6d64bd2f"></script>
<script src="../assets/vendor/topojson-client.v3.min.js?v=bc057598"></script>
<script src="../assets/js/world-map.js?v=5815203f"></script>
<script src="../assets/js/simulation.js?v=52840602"></script>
<script>
    document.getElementById('sim-panel-toggle').addEventListener('click', function () {
        var panel = document.getElementById('sim-panel');
        var open = panel.classList.toggle('open');
        this.setAttribute('aria-expanded', open);
        this.textContent = 'Search & detail ' + (open ? '▴' : '▾');
    });

    GISimulation.init({
        canvasId: 'sim-canvas',
        canvasWrapSelector: '.sim-canvas-wrap',
        atlasUrl: '../data/world-atlas-countries-110m.json',
        graphUrl: '../data/simulation/graph.json',
        stampId: 'sim-stamp',
        tooltipId: 'sim-tooltip',
        searchId: 'sim-search',
        listHeadId: 'sim-list-head',
        nodeListId: 'sim-node-list',
        detailId: 'sim-detail',
        affectedItemsId: 'sim-affected-items',
        affectedWrapId: 'sim-affected-wrap',
        panelId: 'sim-panel',
        panelToggleId: 'sim-panel-toggle'
    });
</script>

</body>
</html>
